# Deploy only after a NEW independent Git repository has been created.
# Choose free plan; Render may have its own usage limits.
services:
  - type: web
    name: atlas-endustri-agi-independent
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ATLAS_RATE_SALT
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
